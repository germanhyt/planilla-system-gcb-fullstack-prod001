name: CI
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ruff==0.6.9
      - run: ruff check backend
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: planilla, POSTGRES_PASSWORD: planilla, POSTGRES_DB: planilla}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U planilla" --health-interval 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://planilla:planilla@localhost:5432/planilla
      TZ: America/Lima
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt}
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head && python seed.py
      - run: pytest --cov=app --cov-report=term --cov-report=html -q
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/htmlcov/
  frontend-build:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: npm install
      - run: npm run build
